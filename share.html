<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#29282b" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Open a shared Mixly mix in the app." />
    <title>Open Mixly</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      :root {
        color-scheme: dark;
        --background: #29282b;
        --surface: #343436;
        --text: #ffffff;
        --muted: #a5a5a5;
        --accent: #ebff57;
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 90vmax;
        height: 58vmax;
        content: '';
        filter: blur(80px);
        opacity: 0.55;
        transform: rotate(-24deg);
      }

      body::before {
        top: -30vmax;
        right: -42vmax;
        background: linear-gradient(135deg, transparent 28%, rgba(235, 255, 87, 0.78) 72%);
      }

      body::after {
        bottom: -35vmax;
        left: -45vmax;
        background: linear-gradient(135deg, rgba(184, 115, 173, 0.58), transparent 70%);
      }

      main {
        width: min(420px, calc(100% - 40px));
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(52, 52, 54, 0.92);
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.3);
        text-align: left;
      }

      h1 {
        margin: 0;
        color: var(--accent);
        font-size: 54px;
        font-weight: 900;
        line-height: 0.9;
      }

      p {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      a {
        display: block;
        margin-top: 24px;
        padding: 16px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #1d1d1f;
        font-weight: 750;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mixly</h1>
      <p id="status">Opening this mix in the Mixly app...</p>
      <a id="open-button" href="#">Open in Mixly</a>
    </main>
    <script>
      (() => {
        const IOS_STORE_URL = 'https://apps.apple.com/app/id6762792005';
        const ANDROID_STORE_URL =
          'https://play.google.com/store/apps/details?id=com.vladyarmakovich.mixly';
        const ANDROID_PACKAGE = 'com.vladyarmakovich.mixly';
        const params = new URLSearchParams(window.location.search);
        const mixId = (params.get('mix') || params.get('mixId') || '').trim();
        const labPayload = (params.get('lab') || '').trim();
        const isPreview = params.get('preview') === '1';
        const encodedMixId = encodeURIComponent(mixId);
        const userAgent = navigator.userAgent || '';
        const isAndroid = /android/i.test(userAgent);
        const isIOS =
          /iphone|ipad|ipod/i.test(userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        let deepLink = 'mixly://';
        if (labPayload) {
          deepLink = `mixly://lab?data=${encodeURIComponent(labPayload)}`;
        } else if (mixId) {
          deepLink = `mixly://mix/${encodedMixId}`;
        }

        const storeUrl = isAndroid ? ANDROID_STORE_URL : IOS_STORE_URL;
        const androidIntent = labPayload
          ? `intent://lab?data=${encodeURIComponent(labPayload)}#Intent;scheme=mixly;package=${ANDROID_PACKAGE};S.browser_fallback_url=${encodeURIComponent(
              ANDROID_STORE_URL
            )};end`
          : mixId
            ? `intent://mix/${encodedMixId}#Intent;scheme=mixly;package=${ANDROID_PACKAGE};S.browser_fallback_url=${encodeURIComponent(
                ANDROID_STORE_URL
              )};end`
            : ANDROID_STORE_URL;
        const openUrl = isAndroid ? androidIntent : isIOS ? deepLink : storeUrl;
        const button = document.getElementById('open-button');
        const status = document.getElementById('status');
        let fallbackTimer;

        const cancelFallback = () => {
          if (fallbackTimer) window.clearTimeout(fallbackTimer);
          fallbackTimer = undefined;
        };

        const openMixly = () => {
          cancelFallback();

          if (!isIOS) {
            window.location.replace(openUrl);
            return;
          }

          window.location.href = deepLink;
          fallbackTimer = window.setTimeout(() => {
            if (document.visibilityState === 'visible') {
              window.location.replace(IOS_STORE_URL);
            }
          }, 1600);
        };

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') cancelFallback();
        });
        window.addEventListener('pagehide', cancelFallback);
        button.href = openUrl;
        button.addEventListener('click', (event) => {
          event.preventDefault();
          openMixly();
        });

        if (labPayload) status.textContent = 'Opening this lab mix in the Mixly app...';
        else if (!mixId) status.textContent = 'Opening the Mixly app...';
        if (!isPreview) window.setTimeout(openMixly, 120);
      })();
    </script>
  </body>
</html>
